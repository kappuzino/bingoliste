<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Bingo-Liste</title>
<meta name="description" content="Reifen per Barcode Wagen zuordnen und wiederfinden.">
<meta name="theme-color" content="#1d6fd6">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bingo-Liste">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --blue: #1d6fd6;
    --blue-bg: #e6f0fd;
    --blue-text: #0f4c98;
    --green: #1f8a44;
    --green-bg: #e5f5ea;
    --green-text: #196b36;
    --red: #c62828;
    --red-bg: #fbe9e9;
    --red-text: #a01f1f;
    --yellow-bg: #fff6dc;
    --yellow-text: #8a6300;
    --yellow-border: #e8c34a;
    --violet-bg: #f1ebfb;
    --violet-text: #5b2d9e;
    --orange: #c75a0a;
    --orange-bg: #fff1e6;
    --orange-text: #9a4300;

    --bg: #ffffff;
    --surface: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --tile-empty-bg: #ffffff;
    --tile-disabled-text: #bdbdbd;
    --disabled-bg: #f2f2f2;
    --done-bg: #f6f6f6;
    --overlay-bg: rgba(20, 20, 20, 0.92);

    --radius: 12px;
    --gap: 10px;
    --tabbar-h: 64px;
    --vvh: 100vh;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --blue-bg: #123054;
      --blue-text: #8fc0ff;
      --green-bg: #123a20;
      --green-text: #7fe0a0;
      --red-bg: #3d1414;
      --red-text: #ff9b9b;
      --yellow-bg: #3a2f0c;
      --yellow-text: #ffd873;
      --yellow-border: #7a6120;
      --violet-bg: #2a1d42;
      --violet-text: #cdb6f5;
      --orange: #d9732a;
      --orange-bg: #3a2410;
      --orange-text: #ffb27a;

      --bg: #121212;
      --surface: #1a1a1a;
      --border: #333333;
      --text: #f0f0f0;
      --text-muted: #a0a0a0;
      --tile-empty-bg: #1a1a1a;
      --tile-disabled-text: #555555;
      --disabled-bg: #242424;
      --done-bg: #161616;
      --overlay-bg: rgba(0, 0, 0, 0.96);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-weight: 400;
    overscroll-behavior: none;
  }

  .mono {
    font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: var(--vvh);
    height: var(--vvh);
  }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
  }
  .topbar-device { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .app-main {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(var(--tabbar-h) + 16px);
  }

  .tab-panel { display: block; padding: 14px 14px 0; }
  .tab-panel.hidden { display: none; }

  /* ---- Tab bar ---- */
  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: var(--tabbar-h);
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
  }
  body.search-focused .tabbar { display: none; }

  .tab-btn {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    font-family: inherit;
    padding: 6px 0;
    min-height: 48px;
  }
  .tab-btn i { font-size: 22px; }
  .tab-btn.active { color: var(--blue); font-weight: 500; }
  .tab-icon { position: relative; display: inline-flex; }
  .tab-badge {
    position: absolute;
    top: -6px;
    left: 14px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 10px;
    background: var(--red);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    line-height: 20px;
    text-align: center;
  }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 48px;
    padding: 10px 18px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn-outline { background: var(--surface); border-color: var(--border); color: var(--text); }
  .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-outline.btn-danger-outline { color: var(--red-text); border-color: var(--red); background: var(--red-bg); }
  .btn-yellow { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow-text); }
  .btn-block { width: 100%; }
  .btn-lg { min-height: 60px; padding: 14px 26px; font-size: 18px; }
  .btn:active { opacity: 0.75; }
  .btn:disabled, .icon-btn:disabled { opacity: 0.4; cursor: default; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 22px;
  }

  .invalid { border-color: var(--red) !important; }

  /* ---- Cards ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }

  /* ---- Beladen: Wagen grid ---- */
  .section-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 4px 0 8px;
  }

  .wagon-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .wagon-tile {
    position: relative;
    min-height: 56px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--tile-empty-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 4px;
  }
  .wagon-tile .count {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
  }
  .wagon-tile.filled { background: var(--green-bg); color: var(--green-text); border-color: var(--green-bg); }
  .wagon-tile.filled .count { color: var(--green-text); }
  .wagon-tile.selected { background: var(--blue); color: #fff; border-color: var(--blue); }
  .wagon-tile.selected .count { color: #fff; opacity: 0.85; }
  .wagon-tile.empty-grey { color: var(--tile-disabled-text); }
  .wagon-tile.empty-grey .count { color: var(--tile-disabled-text); }

  .beladen-actions { display: flex; gap: 8px; margin-bottom: 16px; }
  .beladen-actions .btn { flex: 1 1 0; }

  .manual-entry { margin-bottom: 16px; }
  .manual-entry label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .manual-entry-row { display: flex; gap: 8px; }
  .manual-input {
    flex: 1 1 auto;
    min-height: 48px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
  }
  .manual-input.mono { letter-spacing: 0.03em; }

  .inline-duplicate {
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid var(--yellow-border);
    background: var(--yellow-bg);
    color: var(--yellow-text);
    border-radius: var(--radius);
    font-size: 14px;
  }
  .inline-duplicate.hidden { display: none; }
  .inline-duplicate .dup-actions { display: flex; gap: 8px; margin-top: 8px; }
  .inline-duplicate .dup-actions .btn { flex: 1 1 0; min-height: 42px; padding: 8px; font-size: 14px; }

  .wagon-list-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .wagon-list-header h3 { margin: 0; font-size: 16px; font-weight: 500; }
  .wagon-list-header .badge { font-size: 13px; color: var(--text-muted); }

  .wagon-list { list-style: none; margin: 0 0 16px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .wagon-list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    gap: 8px;
  }
  .wagon-list-item:last-child { border-bottom: none; }
  .wagon-list-item .barcode-mono { flex: 1 1 auto; overflow-wrap: anywhere; }
  .wagon-list-item .prefix { color: var(--text-muted); }
  .wagon-list-item .short-hl { font-weight: 500; color: var(--blue-text); background: var(--blue-bg); padding: 1px 3px; border-radius: 4px; }
  .wagon-list-item .btn-x {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--red-text);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .wagon-list-empty { padding: 20px 12px; text-align: center; color: var(--text-muted); font-size: 14px; }

  /* ---- Abarbeitung ---- */
  .ab-wrap { max-width: 920px; margin: 0 auto; }
  .missing-bar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 56px;
    margin-bottom: 14px;
    padding: 12px 16px;
    border: 1px solid var(--red);
    border-radius: var(--radius);
    background: var(--red-bg);
    color: var(--red-text);
    font-family: inherit;
    font-size: 17px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
  }
  .missing-bar i { font-size: 22px; }
  .missing-bar span { flex: 1 1 auto; }
  .ab-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .ab-title { font-size: 17px; font-weight: 500; }
  .ab-sub { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
  .ab-empty { text-align: center; padding: 40px 20px; }
  .ab-empty-icon { font-size: 48px; color: var(--text-muted); }
  .ab-empty h2 { font-size: 20px; font-weight: 500; margin: 8px 0 6px; }
  .ab-empty p { color: var(--text-muted); margin: 0 0 20px; }
  .ab-section { margin-top: 18px; }

  .all-done {
    background: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green);
    border-radius: var(--radius);
    padding: 28px 16px;
    text-align: center;
    font-size: 22px;
    font-weight: 500;
  }

  .cust-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .cust-card.hero { border: 2px solid var(--blue); padding: 18px; }
  .cust-top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .cust-time { font-size: 20px; font-weight: 500; }
  .hero .cust-time { font-size: 24px; }
  .cust-ref { font-size: 18px; color: var(--text-muted); letter-spacing: 0.04em; }
  .cust-badge { margin-left: auto; background: var(--green-bg); color: var(--green-text); border-radius: 8px; padding: 4px 10px; font-size: 14px; font-weight: 500; }
  .cust-main { display: flex; align-items: stretch; gap: 12px; flex-wrap: wrap; }
  .cust-plate { flex: 1 1 220px; font-size: 32px; font-weight: 500; line-height: 1.15; letter-spacing: 0.02em; align-self: center; }
  .hero .cust-plate { font-size: 44px; }
  .cust-wagon {
    flex: 1 1 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 44px;
    font-weight: 500;
    line-height: 1.1;
    min-height: 76px;
  }
  .hero .cust-wagon { font-size: 64px; min-height: 104px; }
  .wagon-ok { background: var(--green-bg); color: var(--green-text); }
  .wagon-none { background: var(--red-bg); color: var(--red-text); font-size: 28px; }
  .hero .wagon-none { font-size: 36px; }
  .wagon-self { background: var(--violet-bg); color: var(--violet-text); font-size: 22px; }
  .hero .wagon-self { font-size: 28px; }
  .cust-info { font-size: 14px; color: var(--text-muted); margin-top: 8px; }

  .cust-controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .check-row { display: flex; align-items: center; gap: 14px; min-height: 52px; font-size: 17px; cursor: pointer; }
  .check-row input { flex: 0 0 auto; width: 30px; height: 30px; margin: 0; accent-color: var(--blue); }
  .barcode-row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .barcode-row .btn { min-height: 56px; }
  .barcode-row .icon-btn { width: 56px; height: 56px; }
  .barcode-field {
    flex: 1 1 200px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-height: 56px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .bf-short { font-size: 24px; font-weight: 500; color: var(--blue-text); }
  .bf-full { font-size: 13px; color: var(--text-muted); }
  .bf-empty { font-size: 15px; color: var(--text-muted); }
  .barcode-row.disabled .barcode-field { background: var(--disabled-bg); }
  .remark {
    width: 100%;
    min-height: 52px;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    resize: vertical;
  }
  .btn-done { background: var(--green); border-color: var(--green); color: #fff; min-height: 60px; font-size: 19px; }

  .cust-card.done { background: var(--done-bg); }
  .cust-card.done .cust-time,
  .cust-card.done .cust-plate { color: var(--text-muted); }
  .cust-card.skipped { background: var(--orange-bg); border-color: var(--orange); }
  .cust-card.skipped .cust-time,
  .cust-card.skipped .cust-plate,
  .cust-card.skipped .done-row { color: var(--orange-text); }
  .cust-card.closed .cust-plate { font-size: 22px; }
  .cust-card.closed .cust-wagon { font-size: 22px; min-height: 48px; padding: 6px 12px; flex-basis: 140px; opacity: 0.75; }
  .cust-badge.badge-skip { background: var(--orange-bg); color: var(--orange-text); border: 1px solid var(--orange); }
  .btn-skip {
    margin-left: auto;
    min-height: 44px;
    padding: 6px 12px;
    font-size: 14px;
    color: var(--orange-text);
    border-color: var(--orange);
  }
  .btn-orange { background: var(--orange); border-color: var(--orange); color: #fff; }
  .choice-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .choice { width: 100%; justify-content: flex-start; min-height: 52px; text-align: left; font-weight: 400; }
  .choice.active { background: var(--orange-bg); border-color: var(--orange); color: var(--orange-text); }
  .done-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 10px;
    font-size: 15px;
    color: var(--text-muted);
  }
  .done-remark { font-size: 14px; margin-top: 2px; }

  /* ---- Scan overlay ---- */
  .scan-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay-bg);
    z-index: 50;
    display: flex;
    flex-direction: column;
  }
  .scan-overlay.hidden { display: none; }
  .qr-reader { flex: 1 1 auto; position: relative; overflow: hidden; }
  .qr-reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  #qrReader__scan_region img { display: none; }
  #qrReader__dashboard { display: none !important; }

  .scan-target-label {
    position: absolute;
    top: 12px; left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    z-index: 2;
  }

  .scan-toast {
    position: absolute;
    left: 12px; right: 12px;
    bottom: 96px;
    background: var(--green-bg);
    color: var(--green-text);
    border: 1px solid var(--green);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    z-index: 2;
  }
  .scan-toast.hidden { display: none; }

  .scan-duplicate {
    position: absolute;
    left: 12px; right: 12px;
    bottom: 96px;
    background: var(--yellow-bg);
    color: var(--yellow-text);
    border: 1px solid var(--yellow-border);
    border-radius: var(--radius);
    padding: 14px;
    z-index: 3;
  }
  .scan-duplicate.hidden { display: none; }
  .scan-duplicate p { margin: 0 0 10px; font-size: 15px; font-weight: 500; }
  .scan-duplicate-actions { display: flex; gap: 8px; }
  .scan-duplicate-actions .btn { flex: 1 1 0; }

  .scan-end-btn {
    margin: 12px;
    margin-bottom: calc(12px + env(safe-area-inset-bottom));
  }

  /* ---- Toast (global) ---- */
  .toast {
    position: fixed;
    left: 16px; right: 16px;
    bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom));
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 12px 14px;
    text-align: center;
    font-size: 14px;
    z-index: 70;
    box-shadow: none;
  }
  .toast.hidden { display: none; }

  /* ---- Suchen tab ---- */
  .search-top {
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .search-field-wrap { position: relative; margin-bottom: 8px; }
  .search-hint { margin: 0 0 12px; text-align: center; font-size: 13px; color: var(--text-muted); }
  .search-input {
    width: 100%;
    min-height: 56px;
    padding: 14px 48px 14px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 22px;
    font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    text-align: center;
    letter-spacing: 0.04em;
  }
  .search-input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .search-clear {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 40px; height: 40px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .search-clear.hidden { display: none; }

  .result-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .result-found { background: var(--green-bg); border-color: var(--green); }
  .result-notfound { background: var(--red-bg); border-color: var(--red); color: var(--red-text); font-size: 16px; font-weight: 500; padding: 20px 16px; }
  .result-label { font-size: 13px; color: var(--green-text); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .result-wagon { font-size: 44px; font-weight: 500; color: var(--green-text); line-height: 1.1; margin-bottom: 6px; }
  .result-barcode {
    font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 15px;
    color: var(--green-text);
    opacity: 0.85;
  }

  .result-partial { background: var(--surface); text-align: left; padding: 8px; }
  .result-partial-title { padding: 8px 8px 4px; font-size: 13px; color: var(--text-muted); }
  .partial-list { list-style: none; margin: 0; padding: 0; }
  .partial-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 10px;
    border-top: 1px solid var(--border);
    font-size: 16px;
  }
  .partial-list li .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-weight: 500; }
  .partial-list li .partial-wagon { color: var(--blue-text); background: var(--blue-bg); padding: 2px 8px; border-radius: 8px; font-size: 14px; }

  /* ---- Uebersicht tab ---- */
  .uebersicht-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .uebersicht-total { font-size: 15px; font-weight: 500; }
  .uebersicht-total span { color: var(--blue-text); }

  .uebersicht-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }

  .uebersicht-actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .archive-info { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); text-align: center; }

  /* ---- Modal ---- */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
  }
  .modal.hidden { display: none; }
  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    width: 100%;
    max-width: 400px;
  }
  .modal-card.tone-warn { background: var(--yellow-bg); border-color: var(--yellow-border); }
  .modal-card.tone-warn h3,
  .modal-card.tone-warn p { color: var(--yellow-text); }
  .modal-card.tone-ok { background: var(--green-bg); border-color: var(--green); }
  .modal-card.tone-ok h3,
  .modal-card.tone-ok p { color: var(--green-text); }
  .modal-card.tone-alarm { background: var(--red-bg); border-color: var(--red); }
  .modal-card.tone-alarm h3,
  .modal-card.tone-alarm p { color: var(--red-text); }
  .dialog-list {
    list-style: none;
    margin: 0 0 16px;
    padding: 0;
    max-height: 45vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .dialog-list li {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 10px;
    align-items: baseline;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 16px;
    color: var(--text);
  }
  .dialog-list li:last-child { border-bottom: none; }
  .dialog-list .dl-time { color: var(--text-muted); }
  .dialog-list .dl-plate { font-weight: 500; }
  .modal-card h3 { margin: 0 0 10px; font-size: 18px; font-weight: 500; }
  .modal-card p { margin: 0 0 16px; font-size: 15px; color: var(--text-muted); line-height: 1.4; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 14px; margin-bottom: 6px; }
  .modal-field input,
  .dialog-input {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    font-size: 18px;
  }
  .dialog-input { margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
  .modal-actions .btn { flex: 1 1 0; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar"><h1>Bingo-Liste</h1><span id="deviceLabel" class="topbar-device"></span></header>

  <main class="app-main">
    <!-- BELADEN -->
    <section id="tab-beladen" class="tab-panel">
      <div class="section-title">Wagen wählen</div>
      <div id="wagonGrid" class="wagon-grid"></div>

      <div class="beladen-actions">
        <button id="btnScan" class="btn btn-primary btn-block"><i class="ti ti-camera"></i> Scannen</button>
        <button id="btnLoadDone" class="btn btn-outline btn-block"><i class="ti ti-checklist"></i> Beladen fertig</button>
      </div>

      <div class="manual-entry card">
        <label for="manualInput">Handscanner / manuelle Eingabe</label>
        <div class="manual-entry-row">
          <input id="manualInput" class="manual-input mono" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Barcode + Enter">
        </div>
        <div id="manualDuplicate" class="inline-duplicate hidden">
          <p id="manualDuplicateText"></p>
          <div class="dup-actions">
            <button id="manualRebook" class="btn btn-yellow">Umbuchen</button>
            <button id="manualCancelDup" class="btn btn-outline">Abbrechen</button>
          </div>
        </div>
      </div>

      <div class="wagon-list-header">
        <h3 id="wagonListTitle">W1</h3>
        <span id="wagonListBadge" class="badge">0 Stück</span>
      </div>
      <ul id="wagonList" class="wagon-list"></ul>
    </section>

    <!-- ABARBEITUNG -->
    <section id="tab-abarbeitung" class="tab-panel hidden">
      <div class="ab-wrap">
        <button id="missingBar" class="missing-bar" hidden><i class="ti ti-alert-triangle"></i><span id="missingBarText"></span><i class="ti ti-chevron-right"></i></button>
        <div id="abContent"></div>
      </div>
      <input id="importFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    </section>

    <!-- SUCHEN -->
    <section id="tab-suchen" class="tab-panel hidden">
      <div class="search-top">
        <div class="search-field-wrap">
          <input id="searchInput" class="search-input" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Code eingeben…">
          <button id="searchClear" class="search-clear hidden" aria-label="Leeren"><i class="ti ti-x"></i></button>
        </div>
        <p class="search-hint">Neue Nummer einfach lostippen</p>
        <div id="searchResult" class="search-result"></div>
      </div>
    </section>

    <!-- UEBERSICHT -->
    <section id="tab-uebersicht" class="tab-panel hidden">
      <div class="uebersicht-header">
        <button id="btnSettings" class="icon-btn" aria-label="Einstellungen"><i class="ti ti-settings"></i></button>
        <div class="uebersicht-total">Gesamt: <span id="totalCount">0</span> Stück</div>
      </div>
      <div id="uebersichtGrid" class="uebersicht-grid"></div>
      <div class="uebersicht-actions">
        <button id="btnExport" class="btn btn-outline btn-block"><i class="ti ti-file-spreadsheet"></i> Wagen-CSV exportieren</button>
        <button id="btnExportAll" class="btn btn-outline btn-block"><i class="ti ti-database-export"></i> Alles exportieren</button>
        <button id="btnEndDay" class="btn btn-outline btn-danger-outline btn-block"><i class="ti ti-archive"></i> Tag beenden</button>
        <p id="archiveInfo" class="archive-info"></p>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="beladen"><i class="ti ti-barcode"></i><span>Beladen</span></button>
    <button class="tab-btn" data-tab="abarbeitung"><span class="tab-icon"><i class="ti ti-list-check"></i><span id="missingBadge" class="tab-badge" hidden></span></span><span>Abarbeitung</span></button>
    <button class="tab-btn" data-tab="suchen"><i class="ti ti-search"></i><span>Suchen</span></button>
    <button class="tab-btn" data-tab="uebersicht"><i class="ti ti-layout-grid"></i><span>Übersicht</span></button>
  </nav>
</div>

<div id="toast" class="toast hidden"></div>

<!-- Scan overlay -->
<div id="scanOverlay" class="scan-overlay hidden">
  <div class="qr-reader">
    <div id="scanTargetLabel" class="scan-target-label"></div>
    <div id="qrReader"></div>
    <div id="scanToast" class="scan-toast hidden"></div>
    <div id="scanDuplicate" class="scan-duplicate hidden">
      <p id="scanDuplicateText"></p>
      <div class="scan-duplicate-actions">
        <button id="btnRebook" class="btn btn-yellow">Umbuchen</button>
        <button id="btnCancelDup" class="btn btn-outline">Abbrechen</button>
      </div>
    </div>
  </div>
  <button id="btnEndScan" class="btn btn-primary scan-end-btn"><i class="ti ti-check"></i> Beenden</button>
</div>

<!-- Settings modal -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <h3>Einstellungen</h3>
    <div class="modal-field">
      <label for="settingDevice">Gerätename</label>
      <input id="settingDevice" type="text" autocomplete="off" maxlength="40">
    </div>
    <div class="modal-field">
      <label for="settingNormal">Normale Wagen (W)</label>
      <input id="settingNormal" type="number" min="0" max="99" inputmode="numeric">
    </div>
    <div class="modal-field">
      <label for="settingE">E-Wagen (EW)</label>
      <input id="settingE" type="number" min="0" max="99" inputmode="numeric">
    </div>
    <div class="modal-actions">
      <button id="settingsCancel" class="btn btn-outline">Abbrechen</button>
      <button id="settingsSave" class="btn btn-primary">Speichern</button>
    </div>
  </div>
</div>

<!-- Nicht bearbeitet: Grund wählen -->
<div id="skipModal" class="modal hidden">
  <div class="modal-card">
    <h3>Nicht bearbeitet</h3>
    <p id="skipCustomer"></p>
    <div class="choice-list">
      <button class="btn btn-outline choice" data-reason="Kunde nicht erschienen">Kunde nicht erschienen</button>
      <button class="btn btn-outline choice" data-reason="Kunde abgesagt, Termin verschoben">Kunde abgesagt, Termin verschoben</button>
      <button class="btn btn-outline choice" data-reason="Reifen nicht gefunden">Reifen nicht gefunden</button>
      <button class="btn btn-outline choice" data-reason="Reifen nicht montierbar">Reifen nicht montierbar</button>
      <button class="btn btn-outline choice" data-reason="other">Sonstiges …</button>
    </div>
    <input id="skipOther" class="dialog-input" type="text" placeholder="Grund eingeben (Pflicht)" autocomplete="off" hidden>
    <div class="modal-actions">
      <button id="skipCancel" class="btn btn-outline">Abbrechen</button>
      <button id="skipSave" class="btn btn-orange" hidden>Speichern</button>
    </div>
  </div>
</div>

<!-- Generic dialog (confirm / info / text input) -->
<div id="dialogModal" class="modal hidden">
  <div id="dialogCard" class="modal-card">
    <h3 id="dialogTitle"></h3>
    <p id="dialogText"></p>
    <ul id="dialogList" class="dialog-list" hidden></ul>
    <input id="dialogInput" class="dialog-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" hidden>
    <div class="modal-actions">
      <button id="dialogCancel" class="btn btn-outline">Abbrechen</button>
      <button id="dialogOk" class="btn btn-primary">OK</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ========== Storage (IndexedDB) ========== */
  var DB_NAME = 'bingoListe';
  var LEGACY_DATA_KEY = 'bingoListe.data.v1';
  var LEGACY_SETTINGS_KEY = 'bingoListe.settings.v1';
  var TAB_KEY = 'bingoListe.ui.tab';
  var db = null;

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('archive')) d.createObjectStore('archive', { keyPath: 'id', autoIncrement: true });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function idbRequest(storeName, mode, fn) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, mode);
      var req = fn(tx.objectStore(storeName));
      tx.oncomplete = function () { resolve(req.result); };
      tx.onerror = tx.onabort = function () { reject(tx.error); };
    });
  }
  function kvGet(key) { return idbRequest('kv', 'readonly', function (s) { return s.get(key); }); }
  function kvPut(key, value) { return idbRequest('kv', 'readwrite', function (s) { return s.put(value, key); }); }
  function kvSet(key, value) {
    return kvPut(key, value).catch(function () { showToast('Speichern fehlgeschlagen!', 4000); });
  }
  function archiveAdd(entry) { return idbRequest('archive', 'readwrite', function (s) { return s.add(entry); }); }
  function archiveAll() { return idbRequest('archive', 'readonly', function (s) { return s.getAll(); }); }

  function migrateLegacy() {
    return kvGet('meta').then(function (meta) {
      if (meta) return;
      var legacyData = null, legacySettings = null;
      try {
        legacyData = JSON.parse(localStorage.getItem(LEGACY_DATA_KEY) || 'null');
        legacySettings = JSON.parse(localStorage.getItem(LEGACY_SETTINGS_KEY) || 'null');
      } catch (e) {}
      var writes = [];
      if (legacyData) writes.push(kvPut('wagons', legacyData));
      if (legacySettings) writes.push(kvPut('settings', legacySettings));
      return Promise.all(writes).then(function () {
        return kvPut('meta', { schema: 1, migratedAt: Date.now() });
      });
    });
  }

  /* ========== Model ========== */
  var DEFAULT_SETTINGS = { normalCount: 20, eCount: 4, deviceName: '' };
  var settings = Object.assign({}, DEFAULT_SETTINGS);
  var data = {};
  var day = null;
  var archive = [];

  function saveSettings() { kvSet('settings', settings); }
  function saveData() {
    kvSet('wagons', data);
    refreshMissing();
  }

  var daySaveTimer = null;
  function saveDay() {
    clearTimeout(daySaveTimer);
    daySaveTimer = null;
    kvSet('day', day);
    refreshMissing();
  }
  function saveDaySoon() {
    clearTimeout(daySaveTimer);
    daySaveTimer = setTimeout(saveDay, 400);
  }
  function flushDaySave() { if (daySaveTimer) saveDay(); }

  function wagonIds() {
    var ids = [];
    for (var i = 1; i <= settings.normalCount; i++) ids.push('W' + i);
    for (var j = 1; j <= settings.eCount; j++) ids.push('EW' + j);
    return ids;
  }

  function ensureWagon(id) {
    if (!data[id]) data[id] = [];
    return data[id];
  }

  function wagonNumber(id) { return id.replace(/^EW|^W/, ''); }
  function wagonLongLabel(id) {
    return id.indexOf('EW') === 0 ? ('E-Wagen ' + wagonNumber(id)) : ('Wagen ' + wagonNumber(id));
  }

  function normalize(s) {
    return (s || '').toString().toUpperCase().replace(/O/g, '0').replace(/I/g, '1');
  }
  function shortOf(barcode) {
    return barcode.length > 2 ? barcode.slice(2) : barcode;
  }

  function findLocation(shortNorm) {
    var ids = Object.keys(data);
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var list = data[id] || [];
      for (var k = 0; k < list.length; k++) {
        if (normalize(shortOf(list[k].barcode)) === shortNorm) {
          return { wagonId: id, index: k, entry: list[k] };
        }
      }
    }
    return null;
  }

  function bookBarcode(rawBarcode, targetWagonId) {
    var barcode = (rawBarcode || '').trim();
    if (!barcode) return { status: 'empty' };
    var short = shortOf(barcode);
    var shortNorm = normalize(short);
    var existing = findLocation(shortNorm);
    if (existing && existing.wagonId !== targetWagonId) {
      return { status: 'duplicate', barcode: barcode, short: short, shortNorm: shortNorm, existing: existing };
    }
    if (existing && existing.wagonId === targetWagonId) {
      return { status: 'already', barcode: barcode, short: short };
    }
    ensureWagon(targetWagonId).push({ barcode: barcode, short: short, time: Date.now() });
    saveData();
    return { status: 'booked', barcode: barcode, short: short, count: data[targetWagonId].length };
  }

  function rebook(shortNorm, targetWagonId) {
    var loc = findLocation(shortNorm);
    if (!loc) return null;
    data[loc.wagonId].splice(loc.index, 1);
    var entry = { barcode: loc.entry.barcode, short: loc.entry.short, time: Date.now() };
    ensureWagon(targetWagonId).push(entry);
    saveData();
    return entry;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ========== Dates ========== */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function isoDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function deDate(iso) {
    var p = (iso || '').split('-');
    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : '';
  }
  function hhmm(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ========== State ========== */
  var state = {
    selectedWagonId: 'W1',
    activeTab: 'beladen'
  };

  /* ========== Audio / Vibration ========== */
  var audioCtx = null;
  function unlockAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {}
  }
  function beep() {
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.value = 0.18;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.12);
    } catch (e) {}
  }
  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  /* ========== Toast (global) ========== */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.add('hidden'); }, ms || 2200);
  }

  /* ========== Dialog (confirm / info / text) ========== */
  var dialogModal = document.getElementById('dialogModal');
  var dialogCard = document.getElementById('dialogCard');
  var dialogTitle = document.getElementById('dialogTitle');
  var dialogText = document.getElementById('dialogText');
  var dialogList = document.getElementById('dialogList');
  var dialogInput = document.getElementById('dialogInput');
  var dialogOk = document.getElementById('dialogOk');
  var dialogCancel = document.getElementById('dialogCancel');
  var dialogOpts = null;
  var dialogResolve = null;

  function openDialog(opts) {
    if (dialogResolve) closeDialog(dialogOpts && dialogOpts.input ? null : false);
    return new Promise(function (resolve) {
      dialogOpts = opts;
      dialogResolve = resolve;
      dialogTitle.textContent = opts.title || '';
      dialogText.textContent = opts.text || '';
      dialogText.hidden = !opts.text;
      var rows = opts.list || [];
      dialogList.hidden = rows.length === 0;
      dialogList.innerHTML = rows.map(function (row) {
        return '<li><span class="dl-time">' + escapeHtml(row[0]) + '</span>' +
          '<span class="dl-plate">' + escapeHtml(row[1]) + '</span>' +
          '<span class="mono">' + escapeHtml(row[2]) + '</span></li>';
      }).join('');
      dialogList.scrollTop = 0;
      dialogInput.hidden = !opts.input;
      dialogInput.value = opts.value || '';
      dialogInput.placeholder = opts.placeholder || '';
      dialogInput.classList.toggle('mono', !!opts.mono);
      dialogInput.setAttribute('autocapitalize', opts.mono ? 'characters' : 'sentences');
      dialogInput.classList.remove('invalid');
      dialogCancel.hidden = opts.cancel === null;
      dialogCancel.textContent = opts.cancel || 'Abbrechen';
      dialogOk.textContent = opts.ok || 'OK';
      dialogOk.className = 'btn ' + ({ danger: 'btn-danger', warn: 'btn-yellow' }[opts.tone] || 'btn-primary');
      dialogCard.className = 'modal-card' + (opts.tone === 'warn' ? ' tone-warn' : '') + (opts.alarm ? ' tone-alarm' : '') + (opts.success ? ' tone-ok' : '');
      dialogModal.classList.remove('hidden');
      if (opts.input) dialogInput.focus();
    });
  }
  function closeDialog(value) {
    dialogModal.classList.add('hidden');
    var resolve = dialogResolve;
    dialogResolve = null;
    dialogOpts = null;
    if (resolve) resolve(value);
  }
  dialogOk.addEventListener('click', function () {
    if (dialogOpts && dialogOpts.input) {
      var v = dialogInput.value.trim();
      if (!v && dialogOpts.required) {
        dialogInput.classList.add('invalid');
        dialogInput.focus();
        return;
      }
      closeDialog(v);
    } else {
      closeDialog(true);
    }
  });
  dialogCancel.addEventListener('click', function () {
    closeDialog(dialogOpts && dialogOpts.input ? null : false);
  });
  dialogInput.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      dialogOk.click();
    }
  });

  function askConfirm(opts) { return openDialog(opts); }
  function askText(opts) { return openDialog(Object.assign({ input: true }, opts)); }
  function showInfo(title, text) { return openDialog({ title: title, text: text, ok: 'OK', cancel: null }); }

  /* ========== Tabs ========== */
  var TAB_NAMES = ['beladen', 'abarbeitung', 'suchen', 'uebersicht'];
  var tabButtons = document.querySelectorAll('.tab-btn');
  var tabPanels = {
    beladen: document.getElementById('tab-beladen'),
    abarbeitung: document.getElementById('tab-abarbeitung'),
    suchen: document.getElementById('tab-suchen'),
    uebersicht: document.getElementById('tab-uebersicht')
  };
  function switchTab(name) {
    if (scanning) endScanSession();
    state.activeTab = name;
    try { localStorage.setItem(TAB_KEY, name); } catch (e) {}
    Object.keys(tabPanels).forEach(function (key) {
      tabPanels[key].classList.toggle('hidden', key !== name);
    });
    tabButtons.forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === name);
    });
    if (name === 'uebersicht') renderUebersicht();
    if (name === 'beladen') renderBeladen();
    if (name === 'abarbeitung') renderAbarbeitung();
    if (name !== 'suchen') {
      document.getElementById('searchInput').blur();
    }
  }
  function initialTab() {
    var saved = null;
    try { saved = localStorage.getItem(TAB_KEY); } catch (e) {}
    return TAB_NAMES.indexOf(saved) !== -1 ? saved : 'beladen';
  }
  tabButtons.forEach(function (btn) {

  var appMain = document.querySelector('.app-main');
  function scrollMainTop() { appMain.scrollTo({ top: 0, behavior: 'smooth' }); }

  /* ========== Beladen: Wagon grid & list ========== */
  var wagonGridEl = document.getElementById('wagonGrid');
  var wagonListEl = document.getElementById('wagonList');
  var wagonListTitleEl = document.getElementById('wagonListTitle');
  var wagonListBadgeEl = document.getElementById('wagonListBadge');

  function renderBeladen() {
    var ids = wagonIds();
    if (ids.indexOf(state.selectedWagonId) === -1) state.selectedWagonId = ids[0] || 'W1';

    var html = '';
    ids.forEach(function (id) {
      var count = (data[id] || []).length;
      var cls = 'wagon-tile';
      if (id === state.selectedWagonId) cls += ' selected';
      else if (count > 0) cls += ' filled';
      html += '<button class="' + cls + '" data-wagon="' + id + '">' + id +
        '<span class="count">' + count + '</span></button>';
    });
    wagonGridEl.innerHTML = html;
    wagonGridEl.querySelectorAll('.wagon-tile').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.selectedWagonId = btn.getAttribute('data-wagon');
        renderBeladen();
      });
    });

    var list = data[state.selectedWagonId] || [];
    wagonListTitleEl.textContent = state.selectedWagonId;
    wagonListBadgeEl.textContent = list.length + ' Stück';

    if (list.length === 0) {
      wagonListEl.innerHTML = '<li class="wagon-list-empty">Noch keine Barcodes auf diesem Wagen</li>';
    } else {
      var itemsHtml = '';
      for (var i = list.length - 1; i >= 0; i--) {
        var e = list[i];
        var prefix = e.barcode.length > 2 ? e.barcode.slice(0, 2) : '';
        itemsHtml += '<li class="wagon-list-item">' +
          '<span class="barcode-mono mono"><span class="prefix">' + escapeHtml(prefix) + '</span>' +
          '<span class="short-hl">' + escapeHtml(e.short) + '</span></span>' +
          '<button class="btn-x" data-idx="' + i + '" aria-label="Löschen"><i class="ti ti-x"></i></button></li>';
      }
      wagonListEl.innerHTML = itemsHtml;
      wagonListEl.querySelectorAll('.btn-x').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var idx = parseInt(btn.getAttribute('data-idx'), 10);
          data[state.selectedWagonId].splice(idx, 1);
          saveData();
          renderBeladen();
        });
      });
    }
  }

  /* ========== Scanning (camera) ========== */
  // mode 'load': Dauerscan auf den gewählten Wagen. mode 'single': ein Code, dann Callback.
  var html5QrCode = null;
  var scanning = false;
  var startPromise = null;
  var scanMode = 'load';
  var singleScanCallback = null;
  var singleScanDone = false;
  var lastCode = null, lastTime = 0;
  var pendingDuplicate = null;

  var scanOverlay = document.getElementById('scanOverlay');
  var scanTargetLabel = document.getElementById('scanTargetLabel');
  var scanToast = document.getElementById('scanToast');
  var scanDuplicate = document.getElementById('scanDuplicate');
  var scanDuplicateText = document.getElementById('scanDuplicateText');
  var btnScan = document.getElementById('btnScan');
  var btnEndScan = document.getElementById('btnEndScan');
  var btnRebook = document.getElementById('btnRebook');
  var btnCancelDup = document.getElementById('btnCancelDup');

  var scanToastTimer = null;
  function showScanToast(msg) {
    scanToast.textContent = msg;
    scanToast.classList.remove('hidden');
    clearTimeout(scanToastTimer);
    scanToastTimer = setTimeout(function () { scanToast.classList.add('hidden'); }, 1600);
  }

  function onScanSuccess(decodedText) {
    if (scanMode === 'single') {
      if (singleScanDone) return;
      singleScanDone = true;
      beep(); vibrate(60);
      var cb = singleScanCallback;
      endScanSession().then(function () { if (cb) cb(decodedText); });
      return;
    }
    var now = Date.now();
    if (decodedText === lastCode && (now - lastTime) < 3000) return;
    lastCode = decodedText;
    lastTime = now;
    handleScanResult(decodedText);
  }

  function handleScanResult(raw) {
    var target = state.selectedWagonId;
    var result = bookBarcode(raw, target);
    if (result.status === 'booked') {
      beep(); vibrate(60);
      showScanToast(result.short + ' → ' + wagonLongLabel(target) + ' (' + result.count + ' Stück)');
      renderBeladen();
    } else if (result.status === 'already') {
      showScanToast(result.short + ' bereits auf ' + wagonLongLabel(target));
    } else if (result.status === 'duplicate') {
      pauseScan();
      pendingDuplicate = result;
      scanDuplicateText.textContent = result.short + ' schon auf ' + result.existing.wagonId;
      scanDuplicate.classList.remove('hidden');
    }
  }

  function pauseScan() {
    if (html5QrCode && scanning) {
      try { html5QrCode.pause(true); } catch (e) {}
    }
  }
  function resumeScan() {
    if (html5QrCode && scanning) {
      try { html5QrCode.resume(); } catch (e) {}
    }
  }

  btnRebook.addEventListener('click', function () {
    if (!pendingDuplicate) return;
    var entry = rebook(pendingDuplicate.shortNorm, state.selectedWagonId);
    if (entry) {
      beep(); vibrate(60);
      showScanToast(pendingDuplicate.short + ' → ' + wagonLongLabel(state.selectedWagonId) + ' umgebucht');
      renderBeladen();
    }
    pendingDuplicate = null;
    scanDuplicate.classList.add('hidden');
    lastCode = null;
    resumeScan();
  });
  btnCancelDup.addEventListener('click', function () {
    pendingDuplicate = null;
    scanDuplicate.classList.add('hidden');
    lastCode = null;
    resumeScan();
  });

  function selectNextWagon() {
    var ids = wagonIds();
    var idx = ids.indexOf(state.selectedWagonId);
    if (idx === -1) idx = 0;
    state.selectedWagonId = ids[(idx + 1) % ids.length];
  }

  btnScan.addEventListener('click', function () {
    unlockAudio();
    startScanSession({ mode: 'load' });
  });
  btnEndScan.addEventListener('click', function () {
    endScanSession();
  });

  function startScanSession(opts) {
    scanMode = opts.mode;
    singleScanCallback = opts.onCode || null;
    singleScanDone = false;
    scanOverlay.classList.remove('hidden');
    scanTargetLabel.textContent = scanMode === 'single' ? opts.label : 'Ziel: ' + state.selectedWagonId;
    btnEndScan.innerHTML = scanMode === 'single'
      ? '<i class="ti ti-x"></i> Abbrechen'
      : '<i class="ti ti-check"></i> Beenden';
    scanDuplicate.classList.add('hidden');
    scanToast.classList.add('hidden');
    pendingDuplicate = null;
    lastCode = null;

    try {
      html5QrCode = new Html5Qrcode('qrReader', {
        formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128],
        verbose: false
      });
      var config = { fps: 12, qrbox: function (vw, vh) {
        var w = Math.min(vw * 0.85, 360);
        var h = Math.max(90, Math.min(vh * 0.28, 170));
        return { width: w, height: h };
      } };
      startPromise = html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess, function () {})
        .then(function () { scanning = true; })
        .catch(function () {
          html5QrCode = null;
          scanning = false;
          showToast('Kamera konnte nicht gestartet werden.');
          scanOverlay.classList.add('hidden');
        });
    } catch (err) {
      showToast('Kamera nicht verfügbar.');
      scanOverlay.classList.add('hidden');
    }
  }

  function endScanSession() {
    var qr = html5QrCode;
    var mode = scanMode;
    return (startPromise || Promise.resolve()).then(function () {
      if (qr && scanning) return qr.stop().catch(function () {});
    }).then(function () {
      if (qr) { try { qr.clear(); } catch (e) {} }
      if (html5QrCode === qr) html5QrCode = null;
      scanning = false;
      startPromise = null;
      scanOverlay.classList.add('hidden');
      if (mode === 'load') {
        selectNextWagon();
        renderBeladen();
      }
    });
  }

  /* ========== Manual entry ========== */
  var manualInput = document.getElementById('manualInput');
  var manualDuplicate = document.getElementById('manualDuplicate');
  var manualDuplicateText = document.getElementById('manualDuplicateText');
  var manualRebook = document.getElementById('manualRebook');
  var manualCancelDup = document.getElementById('manualCancelDup');
  var pendingManualDuplicate = null;

  manualInput.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    unlockAudio();
    var raw = manualInput.value;
    var result = bookBarcode(raw, state.selectedWagonId);
    if (result.status === 'booked') {
      beep(); vibrate(60);
      showToast(result.short + ' → ' + wagonLongLabel(state.selectedWagonId) + ' (' + result.count + ' Stück)');
      manualInput.value = '';
      renderBeladen();
    } else if (result.status === 'already') {
      showToast(result.short + ' bereits auf ' + wagonLongLabel(state.selectedWagonId));
      manualInput.value = '';
    } else if (result.status === 'duplicate') {
      pendingManualDuplicate = result;
      manualDuplicateText.textContent = result.short + ' schon auf ' + result.existing.wagonId;
      manualDuplicate.classList.remove('hidden');
    }
  });

  manualRebook.addEventListener('click', function () {
    if (!pendingManualDuplicate) return;
    var entry = rebook(pendingManualDuplicate.shortNorm, state.selectedWagonId);
    if (entry) {

      showToast(pendingManualDuplicate.short + ' → ' + wagonLongLabel(state.selectedWagonId) + ' umgebucht');
      renderBeladen();
    }
    pendingManualDuplicate = null;
    manualDuplicate.classList.add('hidden');

    manualInput.focus();

  manualCancelDup.addEventListener('click', function () {

  });

  /* ========== Import (Excel-Tagesliste) ========== */
  var SELF_DELIVERY = 'SELBSTANLIEFERER';

  function emptyResult() {
    return { selfStorage: false, newBarcode: null, barcodeTime: null, doneTime: null, skipTime: null, skipReason: '', remark: '' };
  }
  function hasResult(c) {
    var r = c.result;
    return r.selfStorage || !!r.newBarcode || !!r.doneTime || !!r.skipTime || !!r.remark;
  }
  function isClosed(c) { return !!(c.result.doneTime || c.result.skipTime); }
  function customerKey(c) {
    return c.selfDelivery ? 'S|' + normalize(c.plate) : 'R|' + normalize(c.ref);
  }

  function excelSerialToIso(serial, date1904) {
    var days = Math.floor(serial) + (date1904 ? 1462 : 0);
    var d = new Date(Date.UTC(1899, 11, 30) + days * 86400000);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }
  function parseTimeCell(v, date1904) {
    if (typeof v === 'number' && isFinite(v)) {
      return {
        minutes: Math.round((v - Math.floor(v)) * 1440) % 1440,
        date: v >= 1 ? excelSerialToIso(v, date1904) : null
      };
    }
    var m = String(v === null || v === undefined ? '' : v).match(/(\d{1,2})[:.](\d{2})/);
    if (m) return { minutes: parseInt(m[1], 10) * 60 + parseInt(m[2], 10), date: null };
    return { minutes: null, date: null };
  }
  function minutesToHHMM(m) { return m === null ? '' : pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); }

  function validIso(y, mo, d) {
    var dt = new Date(y, mo - 1, d);
    return (dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d) ? isoDate(dt) : null;
  }
  function dateFromFileName(name) {
    var m = name.match(/(\d{1,2})[-_.](\d{1,2})[-_.](\d{4})/);
    if (m) return validIso(+m[3], +m[2], +m[1]);
    m = name.match(/(\d{4})[-_.](\d{1,2})[-_.](\d{1,2})/);
    if (m) return validIso(+m[1], +m[2], +m[3]);
    return null;
  }

  function cellText(v) { return v === null || v === undefined ? '' : String(v).trim(); }

  function parseRows(rows, fileName, date1904) {
    if (!rows.length) return { error: 'Die Datei ist leer.' };
    var header = rows[0].map(function (h) { return cellText(h).toLowerCase(); });
    function col(names) {
      for (var i = 0; i < names.length; i++) {
        var k = header.indexOf(names[i]);
        if (k !== -1) return k;
      }
      return -1;
    }
    var cTime = col(['uhrzeit', 'zeit']);
    var cPlate = col(['kennzeichen']);
    var cRef = col(['referenznummer', 'referenz']);
    var cInfo = col(['zusatzinfo', 'zusatz']);
    var missing = [];
    if (cTime < 0) missing.push('Uhrzeit');
    if (cPlate < 0) missing.push('Kennzeichen');
    if (cRef < 0) missing.push('Referenznummer');
    if (missing.length) {
      return { error: 'Spalte fehlt: ' + missing.join(', ') + '. Erwartet in Zeile 1: Uhrzeit, Kennzeichen, Referenznummer, Zusatzinfo.' };
    }

    var customers = [];
    var cellDate = null;
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r] || [];
      var plate = cellText(row[cPlate]);
      var ref = cellText(row[cRef]);
      if (!plate && !ref) continue;
      var t = parseTimeCell(row[cTime], date1904);
      if (t.date && !cellDate) cellDate = t.date;
      customers.push({
        id: 'c' + customers.length,
        order: customers.length,
        minutes: t.minutes,
        time: minutesToHHMM(t.minutes),
        plate: plate,
        ref: ref,
        info: cInfo >= 0 ? cellText(row[cInfo]) : '',
        selfDelivery: ref.toUpperCase() === SELF_DELIVERY,
        result: emptyResult()
      });
    }
    if (!customers.length) return { error: 'In der Datei wurden keine Termine gefunden.' };
    return {
      date: cellDate || dateFromFileName(fileName) || isoDate(new Date()),
      fileName: fileName,
      customers: customers
    };
  }

  var sheetJsPromise = null;
  function loadSheetJs() {
    if (window.XLSX) return Promise.resolve();
    if (!sheetJsPromise) {
      sheetJsPromise = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'vendor/xlsx.full.min.js';
        s.onload = resolve;
        s.onerror = function () { sheetJsPromise = null; reject(new Error('SheetJS nicht ladbar')); };
        document.head.appendChild(s);
      });
    }
    return sheetJsPromise;
  }
  function readFileAsArrayBuffer(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsArrayBuffer(file);
    });
  }

  async function importFile(file) {
    var parsed;
    try {
      await loadSheetJs();
      var buf = await readFileAsArrayBuffer(file);
      var wb = XLSX.read(buf, { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
      var date1904 = !!(wb.Workbook && wb.Workbook.WBProps && wb.Workbook.WBProps.date1904);
      parsed = parseRows(rows, file.name, date1904);
    } catch (e) {
      await showInfo('Import fehlgeschlagen', 'Die Datei konnte nicht gelesen werden. Bitte eine .xlsx-Datei wählen.');
      return;
    }
    if (parsed.error) {
      await showInfo('Import fehlgeschlagen', parsed.error);
      return;
    }

    var alreadyEnded = archive.some(function (e) { return e.reason === 'tag-beendet' && e.date === parsed.date; });
    if (alreadyEnded) {
      var goOn = await askConfirm({
        title: 'Tag bereits beendet',
        text: 'Für den ' + deDate(parsed.date) + ' wurde schon ein Tag archiviert. Liste trotzdem importieren?',
        ok: 'Importieren'
      });
      if (!goOn) return;
    }
    if (day) {
      var sameDate = day.date === parsed.date;
      var replace = await askConfirm({
        title: 'Liste ersetzen?',
        text: sameDate
          ? 'Die Liste vom ' + deDate(day.date) + ' ist bereits geladen. Erfasste Ergebnisse bleiben bei gleicher Referenz erhalten.'
          : 'Aktuell ist die Liste vom ' + deDate(day.date) + ' geladen. Sie wird archiviert und durch die Liste vom ' + deDate(parsed.date) + ' ersetzt.',
        ok: 'Liste ersetzen'
      });
      if (!replace) return;
    }

    try {
      await applyImport(parsed);
    } catch (e) {
      await showInfo('Import fehlgeschlagen', 'Die bisherige Liste konnte nicht archiviert werden. Es wurde nichts geändert.');
      return;
    }
    renderAbarbeitung();
    scrollMainTop();
    showMissingSummary(parsed.customers.length + ' Termine vom ' + deDate(parsed.date) + ' importiert');
  }

  // Gleiches Datum: Ergebnisse per Referenz übernehmen, nicht mehr gelistete Kunden mit
  // Ergebnis archivieren. Anderes Datum: bisherige Liste komplett archivieren.
  function applyImport(parsed) {
    var toArchive = null;
    if (day) {
      if (day.date === parsed.date) {
        var pool = {};
        day.customers.forEach(function (c) {
          if (!hasResult(c)) return;
          var k = customerKey(c);
          (pool[k] = pool[k] || []).push(c);
        });
        parsed.customers.forEach(function (nc) {
          var q = pool[customerKey(nc)];
          if (q && q.length) nc.result = q.shift().result;
        });
        var dropped = [];
        Object.keys(pool).forEach(function (k) { dropped = dropped.concat(pool[k]); });
        if (dropped.length) toArchive = archiveEntryFor(day, dropped, 'ersetzt', false);
      } else {
        toArchive = archiveEntryFor(day, day.customers, 'ersetzt', false);
      }
    }
    return (toArchive ? addToArchive(toArchive) : Promise.resolve()).then(function () {
      day = { date: parsed.date, fileName: parsed.fileName, importedAt: Date.now(), customers: parsed.customers };
      saveDay();
    });
  }

  /* ========== Archiv ========== */
  function archiveEntryFor(dayObj, customers, reason, includeWagons) {
    return {
      reason: reason,
      date: dayObj ? dayObj.date : isoDate(new Date()),
      fileName: dayObj ? dayObj.fileName : null,
      importedAt: dayObj ? dayObj.importedAt : null,
      deviceName: settings.deviceName,
      archivedAt: Date.now(),
      customers: customers.map(function (c) {
        var copy = JSON.parse(JSON.stringify(c));
        copy.wagon = wagonForCustomer(c);
        return copy;
      }),
      wagons: includeWagons ? JSON.parse(JSON.stringify(data)) : null
    };
  }
  function addToArchive(entry) {
    return archiveAdd(entry).then(function (id) {
      entry.id = id;
      archive.push(entry);
      renderArchiveInfo();
    });
  }

  /* ========== Abarbeitung ========== */
  var abContent = document.getElementById('abContent');
  var importFileInput = document.getElementById('importFile');

  function wagonForCustomer(c) {
    if (c.selfDelivery || !c.ref) return null;
    var loc = findLocation(normalize(c.ref));
    return loc ? loc.wagonId : null;
  }
  function canComplete(c) { return c.result.selfStorage || !!c.result.newBarcode; }
  function customerById(id) {
    if (!day) return null;
    for (var i = 0; i < day.customers.length; i++) {
      if (day.customers[i].id === id) return day.customers[i];
    }
    return null;
  }
  function cardCustomer(el) {
    var card = el.closest('[data-cid]');
    return card ? customerById(card.getAttribute('data-cid')) : null;
  }
  function sortedCustomers() {
    return day.customers.slice().sort(function (a, b) {
      var am = a.minutes === null ? 1e9 : a.minutes;
      var bm = b.minutes === null ? 1e9 : b.minutes;
      return (am - bm) || (a.order - b.order);
    });
  }

  /* ---- Fehlende Reifen ---- */
  // Fehlend = kein Selbstanlieferer, nicht abgeschlossen, Referenz auf keinem Wagen.
  var missingBar = document.getElementById('missingBar');
  var missingBarText = document.getElementById('missingBarText');
  var missingBadge = document.getElementById('missingBadge');

  function missingCheck() {
    var res = { found: 0, self: 0, missing: [] };
    if (!day) return res;
    sortedCustomers().forEach(function (c) {
      if (c.selfDelivery) res.self++;
      else if (wagonForCustomer(c)) res.found++;
      else if (!isClosed(c)) res.missing.push(c);
    });
    return res;
  }
  function refreshMissing() {
    var z = missingCheck().missing.length;
    missingBar.hidden = z === 0;
    missingBarText.textContent = z + (z === 1 ? ' Reifensatz' : ' Reifensätze') + ' nicht auf Wagen';
    missingBadge.hidden = z === 0;
    missingBadge.textContent = z;
  }
  function summaryText(r) {
    return r.found + ' gefunden · ' + r.self + ' Selbstanlieferer · ' + r.missing.length + ' FEHLEN';
  }
  function showMissingSummary(title) {
    var r = missingCheck();
    var z = r.missing.length;
    return openDialog({
      title: title,
      text: summaryText(r),
      list: r.missing.map(function (c) { return [c.time, c.plate, c.ref]; }),
      alarm: z > 0,
      ok: 'OK',
      cancel: null
    });
  }
  missingBar.addEventListener('click', function () { showMissingSummary('Fehlende Reifen'); });

  document.getElementById('btnLoadDone').addEventListener('click', function () {
    if (!day) {
      showInfo('Keine Tagesliste', 'Zum Abgleich zuerst im Tab Abarbeitung die Terminliste importieren.');
      return;
    }
    var r = missingCheck();
    if (r.missing.length) {
      showMissingSummary('Beladen fertig');
    } else {
      openDialog({ title: 'Alle Reifen auf Wagen', text: summaryText(r), success: true, ok: 'OK', cancel: null });
    }
  });

  function customerCard(c, hero) {
    var r = c.result;
    var isDone = !!r.doneTime;
    var isSkipped = !isDone && !!r.skipTime;
    var wagon = wagonForCustomer(c);
    var wagonHtml;
    if (c.selfDelivery) wagonHtml = '<div class="cust-wagon wagon-self">Kunde bringt Reifen mit</div>';
    else if (wagon) wagonHtml = '<div class="cust-wagon wagon-ok">' + escapeHtml(wagonLongLabel(wagon)) + '</div>';
    else wagonHtml = '<div class="cust-wagon wagon-none">Kein Wagen</div>';

    var stateCls = isDone ? ' closed done' : (isSkipped ? ' closed skipped' : '');
    var topRight;
    if (isDone) topRight = '<span class="cust-badge">Erledigt ' + hhmm(r.doneTime) + '</span>';
    else if (isSkipped) topRight = '<span class="cust-badge badge-skip">Nicht bearbeitet ' + hhmm(r.skipTime) + '</span>';
    else topRight = '<button class="btn btn-skip" data-action="skip">Nicht bearbeitet</button>';

    var h = '<article class="cust-card' + (hero ? ' hero' : '') + stateCls + '" data-cid="' + c.id + '">';
    h += '<div class="cust-top"><span class="cust-time">' + escapeHtml(c.time || '–') + '</span>' +
      (c.selfDelivery ? '' : '<span class="cust-ref mono">' + escapeHtml(c.ref) + '</span>') +
      topRight + '</div>';
    h += '<div class="cust-main"><div class="cust-plate">' + escapeHtml(c.plate) + '</div>' + wagonHtml + '</div>';
    if (c.info) h += '<div class="cust-info">' + escapeHtml(c.info) + '</div>';

    if (isDone || isSkipped) {
      var summary;
      if (isSkipped) summary = 'Grund: ' + escapeHtml(r.skipReason);

        '<button class="btn btn-outline" data-action="undo"><i class="ti ti-arrow-back-up"></i> Rückgängig</button></div>';
      return h + '</article>';
    }

    var locked = r.selfStorage;
    var field = r.newBarcode
      ? '<span class="bf-short mono">' + escapeHtml(shortOf(r.newBarcode)) + '</span><span class="bf-full mono">' + escapeHtml(r.newBarcode) + '</span>'
      : '<span class="bf-empty">' + (locked ? 'Kein neuer Barcode nötig' : 'Noch kein neuer Barcode') + '</span>';
    var dis = locked ? ' disabled' : '';
    h += '<div class="cust-controls">' +
      '<label class="check-row"><input type="checkbox" data-action="self-storage"' + (locked ? ' checked' : '') + '>' +
        '<span>Selbsteinlagerung (Kunde nimmt alte Reifen mit)</span></label>' +
      '<div class="barcode-row' + (locked ? ' disabled' : '') + '">' +
        '<div class="barcode-field">' + field + '</div>' +

        '<button class="icon-btn" data-action="edit-new" aria-label="Barcode von Hand eingeben"' + dis + '><i class="ti ti-pencil"></i></button>' +
      '</div>' +

      '<button class="btn btn-done btn-block" data-action="done"' + (canComplete(c) ? '' : ' disabled') + '><i class="ti ti-check"></i> Erledigt</button>' +
      '</div>';
    return h + '</article>';
  }

  function renderAbarbeitung() {

  function barcodeConflicts(c, code) {
    var sn = normalize(shortOf(code));

        out.push('ist heute schon bei ' + o.plate + (o.time ? ' (' + o.time + ')' : '') + ' vergeben');
      }

    return out;
  }

  /* ========== Suchen ========== */
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var searchResult = document.getElementById('searchResult');

  function allEntries() {
    var out = [];
    Object.keys(data).forEach(function (id) {
      (data[id] || []).forEach(function (e) { out.push({ wagonId: id, entry: e }); });
    });
    return out;
  }

  function runSearch(query) {
    var q = query.trim();
    if (q.length < 2) { searchResult.innerHTML = ''; return; }
    var qn = normalize(q);
    var all = allEntries();

    var exact = all.filter(function (x) {
      return normalize(x.entry.short) === qn || normalize(x.entry.barcode) === qn;
    });
    if (exact.length === 1) { renderFoundResult(exact[0]); return; }

    var partial = all.filter(function (x) {
      return normalize(x.entry.short).indexOf(qn) !== -1 || normalize(x.entry.barcode).indexOf(qn) !== -1;
    });
    if (partial.length === 0) { renderNotFound(q); return; }
    if (partial.length === 1) { renderFoundResult(partial[0]); return; }
    renderPartialList(partial);
  }

  function renderFoundResult(match) {
    searchResult.innerHTML =
      '<div class="result-card result-found">' +
      '<div class="result-label">Steht auf</div>' +
      '<div class="result-wagon">' + escapeHtml(wagonLongLabel(match.wagonId)) + '</div>' +
      '<div class="result-barcode mono">' + escapeHtml(match.entry.barcode) + '</div>' +
      '</div>';
    searchInput.focus();
  }

  function renderNotFound(q) {
    searchResult.innerHTML = '<div class="result-card result-notfound">Nicht gefunden: <b class="mono">' + escapeHtml(q) + '</b></div>';
    vibrate(200);
  }

  function renderPartialList(list) {
    var items = list.map(function (x, i) {
      return '<li data-idx="' + i + '"><span class="mono">' + escapeHtml(x.entry.short) + '</span>' +
        '<span class="partial-wagon">' + escapeHtml(x.wagonId) + '</span></li>';

    searchResult.innerHTML = '<div class="result-card result-partial">' +
      '<div class="result-partial-title">' + list.length + ' Treffer</div>' +
      '<ul class="partial-list">' + items + '</ul></div>';
    searchResult.querySelectorAll('.partial-list li').forEach(function (li) {
      li.addEventListener('click', function () {
        var idx = parseInt(li.getAttribute('data-idx'), 10);
        renderFoundResult(list[idx]);
      });
    });
  }

  /* Suche gilt als "abgeschlossen" 4s nach der letzten Eingabe, oder sofort bei
     Enter/Fertig. Ist sie abgeschlossen, startet das naechste getippte Zeichen
     eine komplett neue Suche (Feld wird geleert); Backspace dagegen setzt nur
     die Bearbeitung fort und leert nie von selbst. */
  var searchCompleted = false;
  var completeTimer = null;

  function armCompletionTimer() {
    clearTimeout(completeTimer);
    completeTimer = setTimeout(function () { searchCompleted = true; }, 4000);
  }
  function markCompletedNow() {
    clearTimeout(completeTimer);
    searchCompleted = true;
  }

  function onSearchEdited() {
    var raw = searchInput.value;
    var upper = raw.toUpperCase();
    if (upper !== raw) {
      var pos = searchInput.selectionStart;
      searchInput.value = upper;
      try { searchInput.setSelectionRange(pos, pos); } catch (e) {}
    }
    searchClear.classList.toggle('hidden', searchInput.value.length === 0);
    runSearch(searchInput.value);
    searchCompleted = false;
    armCompletionTimer();
  }

  searchInput.addEventListener('beforeinput', function (ev) {
    if (!searchCompleted) return;
    var isDelete = ev.inputType && ev.inputType.indexOf('delete') === 0;
    if (isDelete) {
      // Bearbeitung des bisherigen Ergebnisses fortsetzen, Feld nicht leeren.
      searchCompleted = false;
      return;
    }
    // Neues Zeichen nach abgeschlossener Suche: Feld leeren, Zeichen uebernehmen.
    ev.preventDefault();
    searchInput.value = (typeof ev.data === 'string' && ev.data) ? ev.data : '';
    onSearchEdited();
  });

  searchInput.addEventListener('input', onSearchEdited);

  searchInput.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      markCompletedNow();
    }
  });
  searchInput.addEventListener('focus', function () { document.body.classList.add('search-focused'); });
  searchInput.addEventListener('blur', function () {
    document.body.classList.remove('search-focused');
    markCompletedNow();
  });
  searchClear.addEventListener('click', function () {
    searchInput.value = '';
    searchResult.innerHTML = '';
    searchClear.classList.add('hidden');
    searchCompleted = false;
    clearTimeout(completeTimer);
    searchInput.focus();
  });

  /* ========== CSV Export ========== */
  function csvEscape(v) {
    v = v === null || v === undefined ? '' : String(v);
    if (/^[=+\-@]/.test(v)) v = "'" + v;
    return /[;"\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function formatTime(ts) {
    var d = new Date(ts);
    return d.toLocaleString('de-DE');
  }
  function dateStamp() {
    var d = new Date();
    return isoDate(d) + '_' + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function fileSafe(s) {
    return (s || '').replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g, '-').replace(/^-+|-+$/g, '') || 'geraet';
  }

  function deliverCsv(fileName, text) {
    var blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
    var file = typeof File === 'function' ? new File([blob], fileName, { type: 'text/csv' }) : null;
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    // iPad/iPhone: Teilen-Dialog (Dateien, OneDrive, Mail); Blob-Downloads sind in
    // installierten iOS-PWAs unzuverlässig.
    if (file && touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: fileName }).catch(function (err) {
        if (err && err.name !== 'AbortError') downloadBlob(fileName, blob);
      });
      return;
    }
    downloadBlob(fileName, blob);
  }
  function downloadBlob(fileName, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  document.getElementById('btnExport').addEventListener('click', function () {
    var rows = ['Wagen;Barcode;Kurzcode;Zeit'];
    wagonIds().forEach(function (id) {
      (data[id] || []).forEach(function (e) {
        rows.push([id, e.barcode, e.short, formatTime(e.time)].map(csvEscape).join(';'));
      });
    });
    deliverCsv('bingo-liste-' + dateStamp() + '.csv', rows.join('\r\n'));
  });

  function exportAll() {
    flushDaySave();
    var groups = archive.map(function (e) {
      return { device: e.deviceName, date: e.date, customers: e.customers, live: false };
    });
    if (day) groups.push({ device: settings.deviceName, date: day.date, customers: day.customers, live: true });

    var rows = [];
    groups.forEach(function (g) {
      g.customers.forEach(function (c) {
        var wagon = g.live ? wagonForCustomer(c) : c.wagon;
        rows.push({
          device: g.device || '',
          date: g.date,
          c: c,
          wagon: c.selfDelivery ? '' : (wagon || 'kein Wagen'),
          since: ''
        });
      });
    });
    if (!rows.length) {
      showToast('Noch keine Daten zum Exportieren');
      return;
    }

    var byDay = {};
    rows.forEach(function (row) {
      if (!row.c.result.doneTime) return;
      var k = row.device + '|' + row.date;
      (byDay[k] = byDay[k] || []).push(row);
    });
    Object.keys(byDay).forEach(function (k) {
      var list = byDay[k].sort(function (a, b) { return a.c.result.doneTime - b.c.result.doneTime; });
      for (var i = 1; i < list.length; i++) {
        list[i].since = Math.round((list[i].c.result.doneTime - list[i - 1].c.result.doneTime) / 60000);
      }
    });

    function planMinutes(row) { return row.c.minutes === null ? 1e9 : row.c.minutes; }
    rows.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (planMinutes(a) - planMinutes(b)) || (a.c.order - b.c.order);
    });

    function yesNo(b) { return b ? 'ja' : 'nein'; }
    function status(r) { return r.doneTime ? 'Erledigt' : (r.skipTime ? 'Nicht bearbeitet' : 'offen'); }
    var lines = ['Gerät;Datum;Uhrzeit Plan;Kennzeichen;Referenz;Zusatzinfo;Wagen;Selbstanlieferer;Selbsteinlagerung;Neuer Barcode;Zeit Barcode;Zeit Erledigt;Min. seit vorherigem Erledigt;Bemerkung;Status;Grund'];
    rows.forEach(function (row) {
      var c = row.c, r = c.result;
      lines.push([
        row.device, deDate(row.date), c.time, c.plate, c.ref, c.info, row.wagon,
        yesNo(c.selfDelivery), yesNo(r.selfStorage), r.newBarcode || '',
        hhmm(r.barcodeTime), hhmm(r.doneTime), row.since, r.remark || '',
        status(r), r.doneTime ? '' : (r.skipReason || '')
      ].map(csvEscape).join(';'));
    });
    deliverCsv('bingo-alles_' + fileSafe(settings.deviceName) + '_' + isoDate(new Date()) + '.csv', lines.join('\r\n'));
  }
  document.getElementById('btnExportAll').addEventListener('click', exportAll);

  /* ========== iOS viewport fix ========== */
  function updateVVH() {
    var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.documentElement.style.setProperty('--vvh', h + 'px');
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateVVH);
    window.visualViewport.addEventListener('scroll', updateVVH);
  }
  window.addEventListener('resize', updateVVH);
  updateVVH();

  window.addEventListener('pagehide', flushDaySave);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushDaySave();
  });

  /* ========== Service worker ========== */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
    });
  }

  /* ========== Init ========== */
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }
  idbOpen()
    .then(function (d) { db = d; return migrateLegacy(); })
    .then(function () { return Promise.all([kvGet('settings'), kvGet('wagons'), kvGet('day'), archiveAll()]); })
    .then(function (res) {
      settings = Object.assign({}, DEFAULT_SETTINGS, res[0] || {});
      data = res[1] || {};
      day = res[2] || null;
      archive = res[3] || [];
      state.selectedWagonId = wagonIds()[0] || 'W1';
      renderDeviceLabel();
      refreshMissing();
      switchTab(initialTab());
      renderUebersicht();
      if (!settings.deviceName) askDeviceName();
    })
    .catch(function () {
      showInfo('Speicher nicht verfügbar', 'Die lokale Datenbank konnte nicht geöffnet werden. Bitte nicht im privaten Modus verwenden.');
    });
})();
</script>
</body>
</html>
